[workspace]
resolver = "3"
members = [
    "crates/scsp-core",
    "crates/scsp-plugin-api",
    "crates/scsp-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Pixdane/ShinySongTools"

[workspace.dependencies]
scsp-core = { path = "crates/scsp-core" }
scsp-plugin-api = { path = "crates/scsp-plugin-api" }

bevy_ecs = { version = "0.19.1", default-features = false, features = ["std"] }
il2cpp-bridge-rs = "=0.1.4"
libc = "0.2"
toml = "0.9"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

trybuild = "1"

[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"
