[package]
name = "runtime"
description = "Shiny Song Tools runtime: App composition root and fixed driver, bootstrap worker, Unity main-thread scheduler, and the FFI entry point."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "shiny_song_tools"
crate-type = ["staticlib", "rlib"]

[dependencies]
corelib = { workspace = true }
debug = { workspace = true }
unlock_fps = { workspace = true }
bevy_ecs = { workspace = true }
crossbeam-queue = { workspace = true }
libc = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-os-layer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }

[features]
default = []
bootstrap-timing-probe = []
